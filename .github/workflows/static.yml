<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ec4899">
<title>Caderno de Erros | Grazielly Brito</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--rosa:#ec4899;--rosa2:#fbcfe8;--lilas:#a78bfa;--lilas2:#ede9fe;--bg:#fdf4ff;--txt:#3b0a45;--mut:#7c6a86;--card:#fff;
--alta:#ef4444;--media:#eab308;--sup:#22c55e;--r:18px;--sh:0 4px 18px rgba(167,139,250,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:linear-gradient(160deg,#fff 0%,var(--bg) 40%,#f5f3ff 100%);color:var(--txt);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1.5px solid #e9d5ff;border-radius:12px;background:#fff;color:var(--txt);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--rosa);box-shadow:0 0 0 3px var(--rosa2)}
textarea{min-height:80px;resize:vertical}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.app{display:flex;min-height:100vh}
aside{width:250px;background:#fff;box-shadow:var(--sh);padding:22px 14px;position:fixed;height:100vh;overflow:auto;z-index:20}
.logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--rosa),var(--lilas));-webkit-background-clip:text;color:transparent;margin:0 8px 22px}
nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--mut);text-decoration:none;font-weight:600;margin-bottom:4px;transition:.2s}
nav a:hover{background:var(--lilas2);color:var(--txt)}
nav a.on{background:linear-gradient(90deg,var(--rosa),var(--lilas));color:#fff;box-shadow:0 4px 14px rgba(236,72,153,.35)}
nav a span{font-size:19px}
main{margin-left:250px;flex:1;padding:24px 30px 90px;max-width:1300px;width:100%}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sync{font-size:13px;background:#fff;padding:8px 14px;border-radius:999px;box-shadow:var(--sh);color:var(--mut)}
.sync b{color:var(--sup)}
.hero{display:flex;align-items:center;gap:24px;background:linear-gradient(120deg,#fce7f3,#ede9fe);border-radius:26px;padding:26px 30px;box-shadow:var(--sh);margin-bottom:22px;overflow:hidden;position:relative}
.hero h1{font-size:34px;letter-spacing:2px;font-weight:900;background:linear-gradient(90deg,var(--rosa),#8b5cf6);-webkit-background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:6px 0 10px}
.hero .nome{display:inline-block;background:#fff;padding:6px 16px;border-radius:999px;font-weight:800;color:var(--rosa);box-shadow:var(--sh)}
.hero svg{flex-shrink:0;width:170px;height:190px}
.btn{padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;transition:.2s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-2px)}
.bp{background:linear-gradient(90deg,var(--rosa),var(--lilas));color:#fff;box-shadow:0 4px 14px rgba(236,72,153,.35)}
.bs{background:var(--lilas2);color:#6d28d9}
.bd{background:#fee2e2;color:#b91c1c}
.bg{background:#dcfce7;color:#15803d}
.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.big{font-size:17px;padding:16px 26px;letter-spacing:.5px}
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);animation:up .35s ease}
.card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stat{text-align:left}
.stat .ic{font-size:24px}
.stat .v{font-size:30px;font-weight:800;margin:4px 0}
.stat .l{font-size:13px;color:var(--mut);font-weight:600}
.msg{background:linear-gradient(120deg,var(--rosa),#8b5cf6);color:#fff;border-radius:22px;padding:24px 28px;margin:0 0 22px;box-shadow:0 8px 24px rgba(139,92,246,.3);font-size:19px;font-weight:600;font-style:italic;position:relative}
.msg small{display:block;font-style:normal;opacity:.85;font-size:12px;letter-spacing:1px;margin-bottom:6px}
.sec{margin:22px 0 14px;font-size:22px;font-weight:800}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.item{border:1.5px solid #f3e8ff;border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;transition:.2s}
.item:hover{border-color:var(--rosa2);box-shadow:var(--sh)}
.item .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:6px}
.item .ds{font-weight:600;margin:6px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qs{width:auto;padding:6px 10px;font-size:13px;border-radius:10px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar .lb{width:130px;flex-shrink:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:#f5f3ff;border-radius:999px;height:14px;overflow:hidden;display:flex}
.bar .fl{height:100%;transition:width .6s}
.bar .n{width:60px;text-align:right;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.opt{border:2px solid #f3e8ff;border-radius:14px;padding:12px;cursor:pointer;transition:.2s;background:#fff}
.opt input{display:none}
.opt b{display:block;margin-bottom:3px}
.opt small{color:var(--mut);font-size:12px}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);transform:scale(1.02)}
.f{margin-bottom:16px}
.req{color:var(--rosa)}
.layout2{display:grid;grid-template-columns:270px 1fr;gap:16px}
.tree div{cursor:pointer;padding:7px 10px;border-radius:10px;font-size:14px;display:flex;justify-content:space-between}
.tree div:hover{background:var(--lilas2)}
.tree .m{font-weight:800}.tree .t{padding-left:22px}.tree .s{padding-left:40px;color:var(--mut)}
.tree .on{background:var(--rosa2)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.empty{text-align:center;padding:34px 14px;color:var(--mut)}
.empty div{font-size:42px;margin-bottom:8px}
.modal-bg{position:fixed;inset:0;background:rgba(59,10,69,.35);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;animation:fade .2s}
.modal{background:#fff;border-radius:22px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow:auto;animation:up .25s}
.modal h2{margin-bottom:14px}
.blk{background:#faf5ff;border-radius:12px;padding:12px;margin-bottom:10px;white-space:pre-wrap}
.blk b{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;letter-spacing:.5px}
.hidden-c{filter:blur(7px);user-select:none}
#toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;box-shadow:var(--sh);animation:up .3s}
.prog{height:18px;background:#f5f3ff;border-radius:999px;overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,var(--lilas),var(--sup));transition:width .8s;border-radius:999px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@media(max-width:900px){
 aside{width:100%;height:auto;bottom:0;top:auto;padding:6px;display:flex}
 .logo{display:none}
 nav{display:flex;width:100%;justify-content:space-around}
 nav a{flex-direction:column;gap:2px;font-size:10px;padding:7px 4px;margin:0;text-align:center}
 nav a .tx{max-width:62px;line-height:1.1}
 main{margin-left:0;padding:16px 14px 100px}
 .hero{flex-direction:column-reverse;text-align:center;padding:20px}
 .hero h1{font-size:26px}
 .layout2{grid-template-columns:1fr}
 .g2{grid-template-columns:1fr}
 .bar .lb{width:95px}
}
</style>
</head>
<body>
<div class="app">
 <aside><div class="logo">📒 Caderno de Erros</div><nav id="nav"></nav></aside>
 <main>
  <header class="top"><div style="font-weight:700;color:var(--mut)" id="pgTitle"></div><div class="sync" id="sync"></div></header>
  <div id="view"></div>
 </main>
</div>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* ===================== CONSTANTES ===================== */
const KEY='caderno_erros_gb_v1', MSGKEY='caderno_erros_gb_lastmsg';
const PRI={alta:{n:'Prioridade alta',i:'🔴',c:'#ef4444',d:'Erros persistentes, conceitos que ainda não domino ou questões que continuo errando mesmo depois de estudar.'},
 media:{n:'Prioridade média',i:'🟡',c:'#eab308',d:'Erros que já compreendi, mas merecem atenção para não se repetirem.'},
 superado:{n:'Superado',i:'🟢',c:'#22c55e',d:'Erros que já corrigi, compreendi e demonstrei domínio com novas questões.'}};
const ORI={desconhecimento:{n:'Desconhecimento',i:'❓',c:'#6366f1',d:'Nunca havia estudado o conceito, termo ou conteúdo.'},
 confusao:{n:'Confusão entre conceitos',i:'🔀',c:'#f97316',d:'Conhecia os conceitos, mas confundi um com o outro.'},
 esquecimento:{n:'Esquecimento',i:'🧠',c:'#0ea5e9',d:'Já havia estudado, mas não lembrei no momento da questão.'},
 interpretacao:{n:'Erro de interpretação',i:'📖',c:'#a855f7',d:'Conhecia o conteúdo, mas interpretei mal o enunciado ou as alternativas.'}};
const NC={n:'Não classificado',i:'⚪',c:'#9ca3af'};
const PAGES=[['dashboard','🏠','Dashboard'],['registrar','➕','Registrar erro'],['erros','📚','Meus erros'],['ciclo','🔁','Segundo ciclo'],['evolucao','📈','Minha evolução'],['materias','🗂️','Matérias e tópicos'],['backup','⚙️','Backup e configurações']];
const MSGS=["Cada erro corrigido é um passo a mais em direção à aprovação.","Você não precisa ser perfeita hoje. Precisa ser melhor do que ontem.","Quem aprende com os próprios erros chega mais preparada à prova.","A aprovação é construída nos dias em que você decide não desistir.","Não tenha medo de errar nas questões. Tenha compromisso em não repetir os mesmos erros.","Seu concorrente pode estudar mais questões. Mas você pode aprender mais com cada uma delas.","Disciplina é continuar mesmo quando a motivação não aparece.","Constância vence intensidade. Um pouco todo dia leva longe.","O erro de hoje é o acerto garantido do dia da prova.","Sua aprovação está sendo escrita, uma revisão de cada vez.","Errar no treino é um privilégio: na prova, você já saberá.","Grandes aprovações nascem de pequenos hábitos repetidos.","Não é sobre não errar. É sobre nunca errar a mesma coisa duas vezes.","Cada questão errada revela exatamente onde você vai crescer.","Persistência transforma dificuldade em domínio.","Quem revisa os erros estuda com inteligência, não só com esforço.","O cansaço passa. A aprovação fica.","Hoje é mais um dia para ficar um pouco mais perto da sua vaga.","Você já superou erros antes. Vai superar estes também.","A evolução diária é silenciosa, mas o resultado é barulhento.","Foco no processo: o resultado é consequência.","Sua dedicação de hoje é o orgulho do seu futuro.","Errar é parte do caminho; desistir não é opção.","Cada 'superado' no seu caderno é uma vitória real.","Os aprovados também erraram. Só não pararam.","Transforme cada erro em um macete que ninguém mais tem.","Disciplina é a ponte entre seus objetivos e suas conquistas.","Um dia de estudo bem feito vale mais que uma semana de promessas.","A dúvida de hoje é a certeza da prova.","Você está construindo uma versão de si que passa na prova.","Mantenha o ritmo. A linha de chegada se aproxima a cada revisão.","Acredite no processo: o conhecimento se acumula, mesmo quando você não percebe.","Persistir é o talento de quem é aprovado."];

/* ===================== ESTADO ===================== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowISO=()=>new Date().toISOString();
const fmt=d=>{if(!d)return'—';const x=new Date(d);return isNaN(x)?'—':x.toLocaleDateString('pt-BR')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function normErro(e){
 if(!e||typeof e!=='object')return null;
 const desc=String(e.descricao||'').trim(), mat=String(e.materia||'').trim();
 if(!desc||!mat)return null;
 return{id:String(e.id||uid()),materia:mat,topico:String(e.topico||'').trim()||'Geral',subtopico:String(e.subtopico||'').trim(),
  descricao:desc,correcao:String(e.correcao||''),macete:String(e.macete||''),
  prioridade:PRI[e.prioridade]?e.prioridade:'alta',
  origem:ORI[e.origem]?e.origem:null, // antigos sem origem => Não classificado
  referencia:String(e.referencia||''),data:isNaN(new Date(e.data))?nowISO():e.data,
  atualizado:e.atualizado||e.data||nowISO(),dataSuperado:e.dataSuperado||null,
  historico:Array.isArray(e.historico)?e.historico:[]};
}
function normState(d){
 const s={erros:[],materias:{},savedAt:d?.savedAt||null};
 (Array.isArray(d?.erros)?d.erros:[]).forEach(e=>{const n=normErro(e);if(n)s.erros.push(n)});
 if(d?.materias&&typeof d.materias==='object')for(const m in d.materias){const t=d.materias[m];s.materias[m]={};if(t&&typeof t==='object')for(const k in t)s.materias[m][k]=Array.isArray(t[k])?t[k].map(String):[]}
 s.erros.forEach(e=>registerTax(s,e));
 return s;
}
function findName(list,name){const n=norm(name);return list.find(x=>norm(x)===n)}
function registerTax(s,e){
 const mk=findName(Object.keys(s.materias),e.materia)||e.materia; e.materia=mk; s.materias[mk]=s.materias[mk]||{};
 const tk=findName(Object.keys(s.materias[mk]),e.topico)||e.topico; e.topico=tk; s.materias[mk][tk]=s.materias[mk][tk]||[];
 if(e.subtopico){const sk=findName(s.materias[mk][tk],e.subtopico);if(sk)e.subtopico=sk;else s.materias[mk][tk].push(e.subtopico)}
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return normState(JSON.parse(r))}catch(e){console.error(e)}
 return normState({materias:{'Clínica Médica':{},'Clínica Cirúrgica':{},'Pediatria':{},'Ginecologia e Obstetrícia':{},'ECG':{},'Preventiva':{}}})}
let S=load();
function save(){S.savedAt=nowISO();try{localStorage.setItem(KEY,JSON.stringify(S));renderSync();return true}catch(e){toast('Erro ao salvar: armazenamento cheio ou bloqueado.','err');return false}}
function renderSync(){document.getElementById('sync').innerHTML=S.savedAt?`<b>●</b> Salvo neste aparelho às ${new Date(S.savedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${fmt(S.savedAt)}`:'○ Nenhum dado salvo ainda'}

/* ===================== UI HELPERS ===================== */
function toast(m,t='ok'){const d=document.createElement('div');d.className='toast';d.style.background=t==='ok'?'#22c55e':'#ef4444';d.textContent=(t==='ok'?'✅ ':'⚠️ ')+m;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
const pBadge=p=>`<span class="badge" style="background:${PRI[p].c}22;color:${PRI[p].c}">${PRI[p].i} ${PRI[p].n}</span>`;
const oInfo=o=>ORI[o]||NC;
const oBadge=o=>{const x=oInfo(o);return`<span class="badge" style="background:${x.c}22;color:${x.c}">${x.i} ${x.n}</span>`};
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function confirmBox(msg,cb){modal(`<h2>⚠️ Confirmar</h2><p style="margin-bottom:18px">${msg}</p><div class="row" style="justify-content:flex-end"><button class="btn bs" onclick="closeModal()">Cancelar</button><button class="btn bd" id="okC">Sim, excluir</button></div>`);document.getElementById('okC').onclick=()=>{closeModal();cb()}}
function bars(items,total){if(!items.length)return empty('📊','Sem dados ainda.');const mx=total||Math.max(...items.map(i=>i.v),1);
 return items.map(i=>`<div class="bar"><div class="lb" title="${esc(i.l)}">${esc(i.l)}</div><div class="tr">${(i.parts||[{v:i.v,c:i.c}]).map(p=>`<div class="fl" style="width:${p.v/mx*100}%;background:${p.c}"></div>`).join('')}</div><div class="n">${i.t??i.v}</div></div>`).join('')}
function donut(parts){const tot=parts.reduce((a,p)=>a+p.v,0);if(!tot)return empty('🍩','Sem dados ainda.');let acc=0;const R=60,C=2*Math.PI*R;
 const segs=parts.filter(p=>p.v).map(p=>{const len=p.v/tot*C;const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${p.c}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 80 80)"/>`;acc+=len;return s}).join('');
 return`<div class="row" style="gap:20px;justify-content:center"><svg width="160" height="160">${segs}<text x="80" y="86" text-anchor="middle" font-size="22" font-weight="800" fill="#3b0a45">${tot}</text></svg><div>${parts.map(p=>`<div style="margin:6px 0;font-size:14px"><span class="badge" style="background:${p.c}22;color:${p.c}">${p.l}</span> <b>${p.v}</b> (${Math.round(p.v/tot*100)}%)</div>`).join('')}</div></div>`}
function lineChart(series,labels){if(!labels.length)return empty('📈','Registre erros para ver sua linha do tempo.');
 const W=600,H=220,P=34,mx=Math.max(1,...series.flatMap(s=>s.d));const x=i=>P+(labels.length===1?(W-2*P)/2:i*(W-2*P)/(labels.length-1)),y=v=>H-P-v/mx*(H-2*P);
 let g='';for(let k=0;k<=4;k++){const v=Math.round(mx*k/4);g+=`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="#f3e8ff"/><text x="4" y="${y(v)+4}" font-size="10" fill="#7c6a86">${v}</text>`}
 const ls=series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round" points="${s.d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+s.d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.c}"><title>${s.l}: ${v}</title></circle>`).join('')).join('');
 const lb=labels.map((l,i)=>(labels.length<=12||i%Math.ceil(labels.length/12)===0)?`<text x="${x(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="#7c6a86">${l}</text>`:'').join('');
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}${ls}${lb}</svg><div class="row" style="justify-content:center">${series.map(s=>`<span class="badge" style="background:${s.c}22;color:${s.c}">● ${s.l}</span>`).join('')}</div>`}
const empty=(i,m)=>`<div class="empty"><div>${i}</div>${m}</div>`;
const count=(arr,fn)=>{const m={};arr.forEach(e=>{const k=fn(e);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};

/* ===================== CARICATURA (SVG) ===================== */
const AVATAR=`<svg viewBox="0 0 200 220" aria-label="Caricatura de Grazielly Brito">
<path d="M40 120 Q30 40 100 30 Q170 40 160 120 L168 200 Q100 215 32 200 Z" fill="#a67c52"/>
<path d="M45 215 Q50 170 100 165 Q150 170 155 215 Z" fill="#fff" stroke="#e9d5ff" stroke-width="2"/>
<path d="M88 165 L100 190 L112 165" fill="none" stroke="#e9d5ff" stroke-width="2"/>
<rect x="90" y="140" width="20" height="28" rx="8" fill="#fbd9c7"/>
<ellipse cx="100" cy="100" rx="45" ry="52" fill="#fde3d3"/>
<path d="M55 95 Q60 45 100 42 Q145 45 147 95 Q130 62 100 64 Q75 62 55 95Z" fill="#8f6640"/>
<path d="M55 90 Q50 140 45 175 L60 175 Q58 130 62 100Z M145 90 Q150 140 155 175 L140 175 Q142 130 138 100Z" fill="#a67c52"/>
<ellipse cx="82" cy="100" rx="9" ry="10" fill="#fff"/><ellipse cx="118" cy="100" rx="9" ry="10" fill="#fff"/>
<circle cx="83" cy="101" r="6" fill="#b07d4b"/><circle cx="117" cy="101" r="6" fill="#b07d4b"/>
<circle cx="84" cy="100" r="2.6" fill="#3b2412"/><circle cx="118" cy="100" r="2.6" fill="#3b2412"/>
<circle cx="86" cy="98" r="1.4" fill="#fff"/><circle cx="120" cy="98" r="1.4" fill="#fff"/>
<path d="M72 86 Q82 80 92 85 M108 85 Q118 80 128 86" stroke="#7a5532" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M98 105 Q96 116 101 118" stroke="#e8b9a0" stroke-width="2" fill="none" stroke-linecap="round"/>
<ellipse cx="70" cy="118" rx="8" ry="5" fill="#f9a8d4" opacity=".55"/><ellipse cx="130" cy="118" rx="8" ry="5" fill="#f9a8d4" opacity=".55"/>
<path d="M86 127 Q100 140 114 127 Q100 133 86 127Z" fill="#e11d74"/>
</svg>`;

/* ===================== ROTEAMENTO ===================== */
