function stats(){const E=S.erros,t=E.length,a=E.filter(e=>e.prioridade==='alta').length,m=E.filter(e=>e.prioridade==='media').length,s=E.filter(e=>e.prioridade==='superado').length;
 return{t,a,m,s,pct:t?Math.round(s/t*100):0,mats:new Set([...Object.keys(S.materias),...E.map(e=>e.materia)]).size}}
function vDash(){const st=stats();const E=S.erros;
 const ult=[...E].sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,5);
