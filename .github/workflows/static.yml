 <div class="grid g6">
  ${[['📝','Total de erros',st.t,'#8b5cf6'],['📚','Matérias',st.mats,'#ec4899'],['🔴','Prioridade alta',st.a,PRI.alta.c],['🟡','Prioridade média',st.m,PRI.media.c],['🟢','Superados',st.s,PRI.superado.c],['🏆','% superados',st.pct+'%','#0ea5e9']]
  .map(([i,l,v,c])=>`<div class="card stat" style="border-top:4px solid ${c}"><div class="ic">${i}</div><div class="v" style="color:${c}">${v}</div><div class="l">${l}</div></div>`).join('')}
 </div>
 <div class="card" style="margin-top:16px"><h3>🚀 Indicador de evolução</h3><div class="prog"><div style="width:${st.pct}%"></div></div>
 <p style="margin-top:8px;color:var(--mut);font-size:14px">${st.t?`Você já superou <b>${st.s}</b> de <b>${st.t}</b> erros registrados (${st.pct}%). ${st.pct>=70?'Excelente evolução! 🌟':st.pct>=40?'Você está no caminho certo! 💪':'Cada revisão conta. Continue! 🌱'}`:'Registre seu primeiro erro para começar a acompanhar sua evolução.'}</p></div>
 <div class="grid g2" style="margin-top:16px">
  <div class="card"><h3>📊 Erros por matéria</h3>${bars(count(E,e=>e.materia).map(([l,v])=>({l,v,c:'linear-gradient(90deg,#ec4899,#a78bfa)'})))}</div>
  <div class="card"><h3>🎯 Distribuição por classificação</h3>${donut(Object.keys(PRI).map(k=>({l:PRI[k].i+' '+PRI[k].n,v:E.filter(e=>e.prioridade===k).length,c:PRI[k].c})))}</div>
  <div class="card"><h3>🕒 Últimos erros registrados</h3>${ult.length?ult.map(e=>`<div class="item" style="cursor:pointer" onclick="details('${e.id}')"><div class="hd"><span>${esc(e.materia)} › ${esc(e.topico)}</span><span>${fmt(e.data)}</span></div><div class="ds">${esc(e.descricao.slice(0,90))}${e.descricao.length>90?'…':''}</div><div class="row">${pBadge(e.prioridade)}${oBadge(e.origem)}</div></div>`).join(''):empty('🌱','Nenhum erro registrado ainda. Que tal começar agora?')}</div>
  <div class="card"><h3>🔥 Assuntos com mais erros</h3>${bars(tops.map(([l,v])=>({l,v,c:'#f472b6'})))}</div>
 </div>`}

/* ===================== FORMULÁRIO ===================== */
function optCards(name,obj,val,extraTxt){return`<div class="opts">${Object.entries(obj).map(([k,o])=>`<label class="opt ${val===k?'sel':''}" style="--c:${o.c}"><input type="radio" name="${name}" value="${k}" ${val===k?'checked':''} onchange="this.closest('.opts').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));this.parentElement.classList.add('sel')"><b>${o.i} ${o.n}</b><small>${o.d}</small></label>`).join('')}</div>`}
function vForm(){const e=editId?S.erros.find(x=>x.id===editId):null;const v=e||{materia:'',topico:'',subtopico:'',descricao:'',correcao:'',macete:'',prioridade:'',origem:'',referencia:'',data:nowISO()};
 const mats=Object.keys(S.materias).sort();
 document.getElementById('view').innerHTML=`<div class="card" style="max-width:900px;margin:auto">
 <h2 style="margin-bottom:6px">${e?'✏️ Editar erro':'➕ Registrar novo erro'}</h2><p style="color:var(--mut);margin-bottom:18px;font-size:14px">Data do registro: <b>${fmt(v.data)}</b> · Campos com <span class="req">*</span> são obrigatórios.</p>
 <form id="fm" novalidate>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
   <div class="f"><label>1. Matéria <span class="req">*</span></label><input name="materia" list="dlM" value="${esc(v.materia)}" placeholder="Escolha ou digite uma nova" oninput="updTopicList()"><datalist id="dlM">${mats.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div>
   <div class="f"><label>2. Tópico <span class="req">*</span></label><input name="topico" list="dlT" value="${esc(v.topico)}" placeholder="Ex.: Cardiologia" oninput="updSubList()"><datalist id="dlT"></datalist></div>
   <div class="f"><label>Subtópico (opcional)</label><input name="subtopico" list="dlS" value="${esc(v.subtopico)}" placeholder="Ex.: Hipertensão arterial"><datalist id="dlS"></datalist></div>
  </div>
  <div class="f"><label>3. Descrição do erro <span class="req">*</span></label><textarea name="descricao" placeholder="O que eu errei?">${esc(v.descricao)}</textarea></div>
  <div class="f"><label>4. Correção / entendimento correto <span class="req">*</span></label><textarea name="correcao" placeholder="Qual é o conceito correto?">${esc(v.correcao)}</textarea></div>
  <div class="f"><label>5. Como evitar esse erro novamente? (macete ou alerta)</label><textarea name="macete" placeholder="💡 Macete, mnemônico ou alerta">${esc(v.macete)}</textarea></div>
  <div class="f"><label>6. Classificação de prioridade <span class="req">*</span></label>${optCards('prioridade',PRI,v.prioridade)}</div>
  <div class="f"><label>Qual foi a origem do meu erro? <span class="req">*</span></label>${optCards('origem',ORI,v.origem)}</div>
  <div class="f"><label>7. Questão de referência (opcional)</label><input name="referencia" value="${esc(v.referencia)}" placeholder="Nº da questão, banca ou link"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px">${e?`<button type="button" class="btn bs" onclick="go('erros')">Cancelar</button>`:''}<button class="btn bp big" type="submit">💾 SALVAR ERRO</button></div>
 </form></div>`;
 updTopicList();updSubList();
 document.getElementById('fm').onsubmit=ev=>{ev.preventDefault();saveForm(e)}}
function updTopicList(){const f=document.getElementById('fm');if(!f)return;const mk=findName(Object.keys(S.materias),f.materia.value);document.getElementById('dlT').innerHTML=mk?Object.keys(S.materias[mk]).map(t=>`<option value="${esc(t)}">`).join(''):'';updSubList()}
function updSubList(){const f=document.getElementById('fm');if(!f)return;const mk=findName(Object.keys(S.materias),f.materia.value);const tk=mk&&findName(Object.keys(S.materias[mk]),f.topico.value);document.getElementById('dlS').innerHTML=tk?S.materias[mk][tk].map(s=>`<option value="${esc(s)}">`).join(''):''}
function saveForm(old){const f=document.getElementById('fm'),fd=new FormData(f);const g=k=>String(fd.get(k)||'').trim();
 const miss=[];if(!g('materia'))miss.push('Matéria');if(!g('topico'))miss.push('Tópico');if(!g('descricao'))miss.push('Descrição');if(!g('correcao'))miss.push('Correção');if(!g('prioridade'))miss.push('Prioridade');if(!g('origem'))miss.push('Origem do erro');
 if(miss.length){toast('Preencha: '+miss.join(', '),'err');return}
 const data={materia:g('materia'),topico:g('topico'),subtopico:g('subtopico'),descricao:g('descricao'),correcao:g('correcao'),macete:g('macete'),prioridade:g('prioridade'),origem:g('origem'),referencia:g('referencia')};
 if(old){const h=[];['prioridade','origem'].forEach(k=>{if(old[k]!==data[k])h.push({data:nowISO(),campo:k,de:old[k],para:data[k]})});
  if(old.prioridade!=='superado'&&data.prioridade==='superado')old.dataSuperado=nowISO();if(data.prioridade!=='superado')old.dataSuperado=null;
  Object.assign(old,data,{atualizado:nowISO()});old.historico.push(...h);registerTax(S,old)}
 else{const e={id:uid(),...data,data:nowISO(),atualizado:nowISO(),dataSuperado:data.prioridade==='superado'?nowISO():null,historico:[{data:nowISO(),campo:'criado',de:null,para:data.prioridade}]};registerTax(S,e);S.erros.push(e)}
 if(save()){toast(old?'Erro atualizado com sucesso!':'Erro registrado! Mais um passo rumo à aprovação 💪');editId=null;go(old?'erros':'dashboard')}}
function editErro(id){closeModal();editId=id;if(location.hash==='#registrar')route();else{location.hash='registrar'}}

/* ===================== AÇÕES RÁPIDAS ===================== */
function setPri(id,p){const e=S.erros.find(x=>x.id===id);if(!e||e.prioridade===p)return;e.historico.push({data:nowISO(),campo:'prioridade',de:e.prioridade,para:p});
 e.dataSuperado=p==='superado'?nowISO():null;e.prioridade=p;e.atualizado=nowISO();if(save())toast(p==='superado'?'Erro superado! 🎉 Histórico preservado.':'Prioridade alterada para '+PRI[p].n+'.')}
function setOri(id,o){const e=S.erros.find(x=>x.id===id);if(!e)return;const nv=ORI[o]?o:null;if(e.origem===nv)return;e.historico.push({data:nowISO(),campo:'origem',de:e.origem,para:nv});e.origem=nv;e.atualizado=nowISO();if(save())toast('Origem atualizada para '+oInfo(nv).n+'.')}
function delErro(id){confirmBox('Tem certeza que deseja excluir este erro? Esta ação não pode ser desfeita.',()=>{S.erros=S.erros.filter(x=>x.id!==id);if(save()){toast('Registro excluído.');rerender()}})}
function details(id){const e=S.erros.find(x=>x.id===id);if(!e)return;const nm=(c,v)=>c==='prioridade'||c==='criado'?(PRI[v]?.n||'—'):oInfo(v).n;
 modal(`<h2>🔎 Detalhes do erro</h2><div class="row" style="margin-bottom:12px">${pBadge(e.prioridade)}${oBadge(e.origem)}<span class="badge" style="background:#f3e8ff">📅 ${fmt(e.data)}</span></div>
 <div class="blk"><b>MATÉRIA › TÓPICO${e.subtopico?' › SUBTÓPICO':''}</b>${esc(e.materia)} › ${esc(e.topico)}${e.subtopico?' › '+esc(e.subtopico):''}</div>
 <div class="blk"><b>DESCRIÇÃO DO ERRO</b>${esc(e.descricao)}</div><div class="blk"><b>CORREÇÃO</b>${esc(e.correcao)}</div>
 ${e.macete?`<div class="blk"><b>💡 COMO EVITAR</b>${esc(e.macete)}</div>`:''}${e.referencia?`<div class="blk"><b>QUESTÃO DE REFERÊNCIA</b>${/^https?:\/\//.test(e.referencia)?`<a href="${esc(e.referencia)}" target="_blank" rel="noopener">${esc(e.referencia)}</a>`:esc(e.referencia)}</div>`:''}
 ${e.historico.length?`<div class="blk"><b>HISTÓRICO DE ALTERAÇÕES</b>${e.historico.map(h=>`${fmt(h.data)} — ${h.campo==='criado'?'Registrado como '+nm('criado',h.para):(h.campo==='prioridade'?'Prioridade':'Origem')+': '+nm(h.campo,h.de)+' → '+nm(h.campo,h.para)}`).join('\n')}</div>`:''}
 <div class="row" style="justify-content:flex-end"><button class="btn bs" onclick="closeModal()">Fechar</button><button class="btn bp" onclick="editErro('${e.id}')">✏️ Editar</button></div>`)}
function itemCard(e,review){return`<div class="item"><div class="hd"><span>📚 <b>${esc(e.materia)}</b> › ${esc(e.topico)}${e.subtopico?' › '+esc(e.subtopico):''}</span><span>📅 ${fmt(e.data)}</span></div>
 <div class="ds">${esc(e.descricao.slice(0,140))}${e.descricao.length>140?'…':''}</div>
 <div class="row" style="margin-bottom:10px">${pBadge(e.prioridade)}${oBadge(e.origem)}</div>
 <div class="row">
  <select class="qs" title="Alterar prioridade" onchange="setPri('${e.id}',this.value);rerender()">${Object.keys(PRI).map(k=>`<option value="${k}" ${k===e.prioridade?'selected':''}>${PRI[k].i} ${PRI[k].n}</option>`).join('')}</select>
  <select class="qs" title="Alterar origem" onchange="setOri('${e.id}',this.value);rerender()">${!e.origem?`<option value="" selected>⚪ Não classificado</option>`:''}${Object.keys(ORI).map(k=>`<option value="${k}" ${k===e.origem?'selected':''}>${ORI[k].i} ${ORI[k].n}</option>`).join('')}</select>
  ${review?`<button class="btn bp sm" onclick="review('${e.id}')">🔁 REVISAR ERRO</button>`:''}
  <button class="btn bs sm" onclick="details('${e.id}')">👁️ Detalhes</button><button class="btn bs sm" onclick="editErro('${e.id}')">✏️ Editar</button><button class="btn bd sm" onclick="delErro('${e.id}')">🗑️ Excluir</button>
 </div></div>`}

/* ===================== MEUS ERROS ===================== */
function applyF(){const q=norm(F.q);return S.erros.filter(e=>(!F.materia||e.materia===F.materia)&&(!F.topico||e.topico===F.topico)&&(!F.subtopico||e.subtopico===F.subtopico)&&(!F.prioridade||e.prioridade===F.prioridade)&&(!F.origem||(F.origem==='nc'?!e.origem:e.origem===F.origem))
 &&(!F.de||e.data.slice(0,10)>=F.de)&&(!F.ate||e.data.slice(0,10)<=F.ate)&&(!q||norm(e.descricao+' '+e.correcao+' '+e.macete+' '+e.topico+' '+e.subtopico).includes(q))).sort((a,b)=>new Date(b.data)-new Date(a.data))}
function setF(k,v){F[k]=v;if(k==='materia'){F.topico='';F.subtopico=''}if(k==='topico')F.subtopico='';vErros()}
function treePick(m,t,s){F.materia=m;F.topico=t;F.subtopico=s;vErros()}
function vErros(){const tree={};S.erros.forEach(e=>{tree[e.materia]=tree[e.materia]||{};tree[e.materia][e.topico]=tree[e.materia][e.topico]||{};const s=e.subtopico||'';tree[e.materia][e.topico][s]=(tree[e.materia][e.topico][s]||0)+1});
 const cnt=o=>typeof o==='number'?o:Object.values(o).reduce((a,x)=>a+cnt(x),0);
 const r=applyF();const mats=Object.keys(tree).sort(),tops=F.materia&&tree[F.materia]?Object.keys(tree[F.materia]).sort():[],subs=F.topico&&tree[F.materia]?.[F.topico]?Object.keys(tree[F.materia][F.topico]).filter(Boolean).sort():[];
 const sel=(k,opts,ph)=>`<select onchange="setF('${k}',this.value)"><option value="">${ph}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${F[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
 document.getElementById('view').innerHTML=`<div class="layout2">
 <div class="card tree"><h3>🗂️ Por matéria</h3><div class="${!F.materia?'on':''}" onclick="treePick('','','')"><span>📋 Todos</span><b>${S.erros.length}</b></div>
 ${mats.map(m=>`<div class="m ${F.materia===m&&!F.topico?'on':''}" onclick="treePick('${esc(m).replace(/'/g,"\\'")}','','')"><span>📘 ${esc(m)}</span><b>${cnt(tree[m])}</b></div>`+Object.keys(tree[m]).sort().map(t=>`<div class="t ${F.materia===m&&F.topico===t&&!F.subtopico?'on':''}" onclick="treePick(${JSON.stringify(m).replace(/"/g,'&quot;')},${JSON.stringify(t).replace(/"/g,'&quot;')},'')"><span>📂 ${esc(t)}</span><b>${cnt(tree[m][t])}</b></div>`+Object.keys(tree[m][t]).filter(Boolean).sort().map(s=>`<div class="s ${F.subtopico===s&&F.topico===t&&F.materia===m?'on':''}" onclick="treePick(${JSON.stringify(m).replace(/"/g,'&quot;')},${JSON.stringify(t).replace(/"/g,'&quot;')},${JSON.stringify(s).replace(/"/g,'&quot;')})"><span>• ${esc(s)}</span><b>${tree[m][t][s]}</b></div>`).join('')).join('')).join('')||empty('🗂️','Sem registros.')}
 </div>
 <div><div class="card" style="margin-bottom:14px"><input id="qq" placeholder="🔍 Buscar palavras nas descrições e correções..." value="${esc(F.q)}" style="margin-bottom:10px">
 <div class="filters">${sel('materia',mats.map(m=>[m,m]),'Todas as matérias')}${sel('topico',tops.map(t=>[t,t]),'Todos os tópicos')}${sel('subtopico',subs.map(s=>[s,s]),'Todos os subtópicos')}
 ${sel('prioridade',Object.keys(PRI).map(k=>[k,PRI[k].i+' '+PRI[k].n]),'Todas as classificações')}${sel('origem',[...Object.keys(ORI).map(k=>[k,ORI[k].i+' '+ORI[k].n]),['nc','⚪ Não classificado']],'Todas as origens')}
 <div><input type="date" value="${F.de}" onchange="setF('de',this.value)" title="Cadastrado a partir de"></div><div><input type="date" value="${F.ate}" onchange="setF('ate',this.value)" title="Cadastrado até"></div></div>
 <div class="row" style="justify-content:space-between"><span style="color:var(--mut);font-size:14px"><b>${r.length}</b> registro(s) encontrado(s)</span><button class="btn bs sm" onclick="F={q:'',materia:'',topico:'',subtopico:'',prioridade:'',origem:'',de:'',ate:''};vErros()">🧹 Limpar filtros</button></div></div>
 <div id="lst">${r.length?r.map(e=>itemCard(e)).join(''):empty(S.erros.length?'🔍':'🌱',S.erros.length?'Nenhum erro corresponde aos filtros.':'Você ainda não registrou erros. <br><br><button class="btn bp" onclick="go(\'registrar\')">+ REGISTRAR NOVO ERRO</button>')}</div></div></div>`;
 const qq=document.getElementById('qq');qq.oninput=()=>{F.q=qq.value;const r2=applyF();document.getElementById('lst').innerHTML=r2.length?r2.map(e=>itemCard(e)).join(''):empty('🔍','Nenhum erro corresponde à busca.')}}

/* ===================== SEGUNDO CICLO ===================== */
function vCiclo(){const ns=S.erros.filter(e=>e.prioridade!=='superado');const A=ns.filter(e=>e.prioridade==='alta'),M=ns.filter(e=>e.prioridade==='media');
 document.getElementById('view').innerHTML=`<h2 class="sec">🔁 Meu segundo ciclo</h2><p style="color:var(--mut);margin:-6px 0 16px">Revise o que ainda não foi superado. Tente lembrar a correção antes de revelar.</p>
 <div class="grid g6"><div class="card stat" style="border-top:4px solid #8b5cf6"><div class="ic">📌</div><div class="v">${ns.length}</div><div class="l">Não superados</div></div>
 <div class="card stat" style="border-top:4px solid ${PRI.alta.c}"><div class="ic">🔴</div><div class="v">${A.length}</div><div class="l">Prioridade alta</div></div>
 <div class="card stat" style="border-top:4px solid ${PRI.media.c}"><div class="ic">🟡</div><div class="v">${M.length}</div><div class="l">Prioridade média</div></div></div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>📚 Matérias com mais dificuldades</h3>${bars(count(ns,e=>e.materia).slice(0,8).map(([l,v])=>({l,v,c:'#ec4899'})))}</div>
 <div class="card"><h3>🎯 Tópicos que precisam de atenção</h3>${bars(count(ns,e=>e.materia+' › '+e.topico).slice(0,8).map(([l,v])=>({l,v,c:'#a78bfa'})))}</div></div>
 <h3 class="sec" style="color:${PRI.alta.c}">🔴 Prioridade alta (${A.length})</h3>${A.length?A.map(e=>itemCard(e,1)).join(''):empty('🎉','Nenhum erro em prioridade alta!')}
 <h3 class="sec" style="color:#a16207">🟡 Prioridade média (${M.length})</h3>${M.length?M.map(e=>itemCard(e,1)).join(''):empty('✨','Nenhum erro em prioridade média.')}`}
function review(id){const e=S.erros.find(x=>x.id===id);if(!e)return;
 modal(`<h2>🔁 Revisar erro</h2><div class="row" style="margin-bottom:12px">${pBadge(e.prioridade)}${oBadge(e.origem)}</div>
 <div class="blk"><b>MATÉRIA › TÓPICO</b>${esc(e.materia)} › ${esc(e.topico)}${e.subtopico?' › '+esc(e.subtopico):''}</div><div class="blk"><b>DESCRIÇÃO DO ERRO</b>${esc(e.descricao)}</div>
 ${e.referencia?`<div class="blk"><b>QUESTÃO DE REFERÊNCIA</b>${esc(e.referencia)}</div>`:''}
 <p style="text-align:center;color:var(--mut);margin:10px 0">🤔 Tente lembrar a correção antes de revelar…</p>
 <div id="rv" class="hidden-c"><div class="blk"><b>CORREÇÃO</b>${esc(e.correcao)}</div>${e.macete?`<div class="blk"><b>💡 COMO EVITAR</b>${esc(e.macete)}</div>`:''}</div>
 <div id="rvb" style="text-align:center;margin:12px 0"><button class="btn bp big" onclick="document.getElementById('rv').classList.remove('hidden-c');this.parentElement.style.display='none';document.getElementById('rva').style.display='flex'">👁️ REVELAR CORREÇÃO</button></div>
 <div id="rva" class="row" style="display:none;justify-content:center;margin-top:12px">
  <button class="btn bd" onclick="setPri('${e.id}','alta');closeModal();rerender()">🔴 Manter alta</button>
  <button class="btn" style="background:#fef9c3;color:#a16207" onclick="setPri('${e.id}','media');closeModal();rerender()">🟡 Alterar para média</button>
  <button class="btn bg" onclick="setPri('${e.id}','superado');closeModal();rerender()">🟢 Marcar como superado</button></div>`)}

/* ===================== EVOLUÇÃO ===================== */
function vEvo(){const E=S.erros,st=stats();
 const months=[];if(E.length){const d0=new Date(Math.min(...E.map(e=>+new Date(e.data))));const d1=new Date();let d=new Date(d0.getFullYear(),d0.getMonth(),1);while(d<=d1){months.push(new Date(d));d.setMonth(d.getMonth()+1)}}
 const end=m=>new Date(m.getFullYear(),m.getMonth()+1,1);
 const regS=months.map(m=>E.filter(e=>new Date(e.data)<end(m)).length),supS=months.map(m=>E.filter(e=>e.dataSuperado&&new Date(e.dataSuperado)<end(m)).length);
 const lbl=months.map(m=>String(m.getMonth()+1).padStart(2,'0')+'/'+m.getFullYear());
 const oc=Object.keys(ORI).map(k=>({k,v:E.filter(e=>e.origem===k).length})).concat([{k:null,v:E.filter(e=>!e.origem).length}]);
 const top=oc.filter(o=>o.k).sort((a,b)=>b.v-a.v)[0];
 const mats=[...new Set(E.map(e=>e.materia))].map(m=>{const x=E.filter(e=>e.materia===m);return{m,t:x.length,s:x.filter(e=>e.prioridade==='superado').length,me:x.filter(e=>e.prioridade==='media').length,a:x.filter(e=>e.prioridade==='alta').length}}).sort((a,b)=>b.t-a.t);
 document.getElementById('view').innerHTML=`<h2 class="sec">📈 Minha evolução</h2><p style="color:var(--mut);margin:-6px 0 16px">Aqui contam os erros <b>registrados no caderno</b> e a superação deles, não os erros cometidos em provas.</p>
 <div class="grid g6">${[['📝','Registrados',st.t,'#8b5cf6'],['🟢','Superados',st.s,PRI.superado.c],['🔴','Em prioridade alta',st.a,PRI.alta.c],['🟡','Em prioridade média',st.m,PRI.media.c],['🚀','Evolução',st.pct+'%','#0ea5e9']].map(([i,l,v,c])=>`<div class="card stat" style="border-top:4px solid ${c}"><div class="ic">${i}</div><div class="v" style="color:${c}">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h3>🗓️ Erros registrados x superados ao longo do tempo (acumulado)</h3>${lineChart([{l:'Registrados',c:'#a78bfa',d:regS},{l:'Superados',c:'#22c55e',d:supS}],lbl)}</div>
 <div class="grid g2" style="margin-top:16px">
 <div class="card"><h3>📚 Evolução por matéria</h3>${mats.length?mats.map(x=>`<div class="bar"><div class="lb" title="${esc(x.m)}">${esc(x.m)}</div><div class="tr"><div class="fl" style="width:${x.s/x.t*100}%;background:${PRI.superado.c}"></div><div class="fl" style="width:${x.me/x.t*100}%;background:${PRI.media.c}"></div><div class="fl" style="width:${x.a/x.t*100}%;background:${PRI.alta.c}"></div></div><div class="n">${Math.round(x.s/x.t*100)}%</div></div>`).join('')+'<p style="font-size:12px;color:var(--mut)">🟢 superados · 🟡 média · 🔴 alta — % = superados na matéria</p>':empty('📚','Sem dados ainda.')}</div>
 <div class="card"><h3>🧭 Origem dos erros</h3>${donut(oc.map(o=>({l:oInfo(o.k).i+' '+oInfo(o.k).n,v:o.v,c:oInfo(o.k).c})))}</div></div>
 <div class="card" style="margin-top:16px"><h3>🔍 Principais causas dos meus erros</h3>
 ${top&&top.v?`<div class="blk" style="background:${ORI[top.k].c}15;border-left:4px solid ${ORI[top.k].c}"><b>ORIGEM MAIS FREQUENTE</b><span style="font-size:18px;font-weight:800;color:${ORI[top.k].c}">${ORI[top.k].i} ${ORI[top.k].n}</span> — ${top.v} erro(s), ${Math.round(top.v/E.length*100)}% do total.<br><small>${{desconhecimento:'Dica: amplie a cobertura do edital com teoria básica dos temas novos.',confusao:'Dica: faça quadros comparativos entre os conceitos que você confunde.',esquecimento:'Dica: aumente a frequência de revisões espaçadas e use flashcards.',interpretacao:'Dica: grife o comando da questão (correta/incorreta, exceto) antes de ler as alternativas.'}[top.k]}</small></div>`:''}
 ${bars(oc.sort((a,b)=>b.v-a.v).map(o=>({l:oInfo(o.k).i+' '+oInfo(o.k).n,v:o.v,c:oInfo(o.k).c,t:`${o.v} · ${E.length?Math.round(o.v/E.length*100):0}%`})),Math.max(1,...oc.map(o=>o.v)))}</div>`}

/* ===================== MATÉRIAS ===================== */
function vMat(){const ms=Object.keys(S.materias).sort();const c=(m,t,s)=>S.erros.filter(e=>e.materia===m&&(t==null||e.topico===t)&&(s==null||e.subtopico===s)).length;
 document.getElementById('view').innerHTML=`<h2 class="sec">🗂️ Matérias e tópicos</h2>
 <div class="card" style="margin-bottom:16px"><h3>➕ Adicionar</h3><div class="filters"><input id="nm" placeholder="Matéria (nova ou existente)" list="dlM2"><datalist id="dlM2">${ms.map(m=>`<option value="${esc(m)}">`).join('')}</datalist><input id="nt" placeholder="Tópico (opcional)"><input id="ns" placeholder="Subtópico (opcional)"><button class="btn bp" onclick="addTax()">Adicionar</button></div></div>
 ${ms.length?ms.map(m=>`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">📘 ${esc(m)} <span class="badge" style="background:#fce7f3;color:#be185d">${c(m)} erro(s)</span></h3>${!c(m)?`<button class="btn bd sm" data-m="${esc(m)}" onclick="delTax(this.dataset.m)">🗑️</button>`:''}</div>
 <div style="margin-top:10px">${Object.keys(S.materias[m]).sort().map(t=>`<div style="padding:6px 0 6px 14px;border-left:3px solid #ede9fe;margin:6px 0"><b>📂 ${esc(t)}</b> <small style="color:var(--mut)">(${c(m,t)})</small> ${!c(m,t)?`<button class="btn bd sm" data-m="${esc(m)}" data-t="${esc(t)}" onclick="delTax(this.dataset.m,this.dataset.t)">×</button>`:''}
 ${S.materias[m][t].map(s=>`<div style="padding-left:18px;font-size:14px;color:var(--mut)">• ${esc(s)} (${c(m,t,s)}) ${!c(m,t,s)?`<button class="btn bd sm" style="padding:2px 8px" data-m="${esc(m)}" data-t="${esc(t)}" data-s="${esc(s)}" onclick="delTax(this.dataset.m,this.dataset.t,this.dataset.s)">×</button>`:''}</div>`).join('')}</div>`).join('')||'<small style="color:var(--mut)">Nenhum tópico ainda.</small>'}</div></div>`).join(''):empty('🗂️','Nenhuma matéria cadastrada.')}
 <p style="font-size:13px;color:var(--mut)">Itens com erros vinculados não podem ser excluídos, para preservar seus registros.</p>`}
function addTax(){const m=document.getElementById('nm').value.trim(),t=document.getElementById('nt').value.trim(),s=document.getElementById('ns').value.trim();if(!m){toast('Informe a matéria.','err');return}if(s&&!t){toast('Para um subtópico, informe o tópico.','err');return}
 const before=JSON.stringify(S.materias);const mk=findName(Object.keys(S.materias),m)||m;S.materias[mk]=S.materias[mk]||{};
 if(t){const tk=findName(Object.keys(S.materias[mk]),t)||t;S.materias[mk][tk]=S.materias[mk][tk]||[];if(s&&!findName(S.materias[mk][tk],s))S.materias[mk][tk].push(s)}
 if(JSON.stringify(S.materias)===before){toast('Esse item já existe.','err');return}if(save()){toast('Adicionado com sucesso!');vMat()}}
function delTax(m,t,s){confirmBox('Excluir este item da lista?',()=>{if(s!=null)S.materias[m][t]=S.materias[m][t].filter(x=>x!==s);else if(t!=null)delete S.materias[m][t];else delete S.materias[m];if(save()){toast('Item excluído.');vMat()}})}

/* ===================== BACKUP ===================== */
function vBackup(){document.getElementById('view').innerHTML=`<h2 class="sec">⚙️ Backup e configurações</h2><div class="grid g2">
 <div class="card"><h3>⬇️ Exportar backup</h3><p style="color:var(--mut);font-size:14px;margin-bottom:12px">Baixa um arquivo JSON com todos os erros, matérias, tópicos, classificações, origens, datas e histórico.</p><button class="btn bp" onclick="exportJSON()">Exportar JSON</button></div>
 <div class="card"><h3>⬆️ Importar backup</h3><p style="color:var(--mut);font-size:14px;margin-bottom:12px">Escolha um arquivo JSON exportado por este app.</p><input type="file" id="fi" accept=".json,application/json" style="margin-bottom:10px">
 <div class="row"><button class="btn bp" onclick="importJSON(false)">Mesclar com os atuais</button><button class="btn bs" onclick="importJSON(true)">Substituir tudo</button></div></div>
 <div class="card"><h3>🔄 Usar em outro aparelho</h3><p style="color:var(--mut);font-size:14px">Os dados ficam salvos neste navegador e continuam lá depois de fechar ou desligar. Para levar os registros a outro aparelho: exporte aqui e importe lá. Para sincronizar automaticamente, é preciso ligar o app a um serviço com login (ex.: Firebase ou Supabase, que têm plano gratuito).</p></div>
 <div class="card"><h3>🗑️ Apagar todos os dados</h3><p style="color:var(--mut);font-size:14px;margin-bottom:12px">Faça um backup antes. Esta ação não pode ser desfeita.</p><button class="btn bd" onclick="confirmBox('Apagar TODOS os erros e matérias deste aparelho?',()=>{S=normState({});save();toast('Dados apagados.');rerender()})">Apagar tudo</button></div></div>`}
function exportJSON(){const data={app:'caderno-erros-grazielly-brito',versao:1,exportadoEm:nowISO(),erros:S.erros,materias:S.materias};
 const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`caderno-erros-backup-${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exportado!')}
function importJSON(replace){const f=document.getElementById('fi').files[0];if(!f){toast('Selecione um arquivo.','err');return}
 const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch{toast('Arquivo inválido: não é um JSON válido.','err');return}
  if(!d||!Array.isArray(d.erros)){toast('Arquivo inválido: não contém a lista de erros.','err');return}
  const inc=normState(d),skipped=d.erros.length-inc.erros.length;
  const run=()=>{if(replace)S=inc;else{const ids=new Set(S.erros.map(e=>e.id));inc.erros.forEach(e=>{if(!ids.has(e.id)){registerTax(S,e);S.erros.push(e)}});for(const m in inc.materias)for(const t in inc.materias[m])inc.materias[m][t].forEach(s=>registerTax(S,{materia:m,topico:t,subtopico:s}));for(const m in inc.materias){const mk=findName(Object.keys(S.materias),m)||m;S.materias[mk]=S.materias[mk]||{};for(const t in inc.materias[m])registerTax(S,{materia:mk,topico:t,subtopico:''})}}
   if(save()){toast(`Importação concluída: ${inc.erros.length} registro(s)${skipped?`, ${skipped} inválido(s) ignorado(s)`:''}.`);rerender()}};
  if(replace)confirmBox('Substituir TODOS os dados atuais pelo backup?',run);else run()};r.readAsText(f)}

/* ===================== INÍCIO ===================== */
route();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
